<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <style>
        :root {
            --bg-primary: #f0f4f8;
            --bg-card: #ffffff;
            --bg-header: #2563eb;
            --bg-table-header: #eff6ff;
            --text-primary: #333333;
            --text-secondary: #4b5563;
            --text-header: #ffffff;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --accent-text: #1e40af;
            --border: #e2e8f0;
            --input-border: #cbd5e1;
            --hover-row: #f8fafc;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --success-border: #bbf7d0;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --error-border: #fecaca;
            --delete-btn: #dc2626;
            --delete-btn-hover: #b91c1c;
            --footer-text: #6b7280;
        }

        .dark-mode {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #1e40af;
            --bg-table-header: #334155;
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --text-header: #ffffff;
            --accent: #3b82f6;
            --accent-dark: #2563eb;
            --accent-text: #93c5fd;
            --border: #475569;
            --input-border: #64748b;
            --hover-row: #334155;
            --success-bg: #166534;
            --success-text: #dcfce7;
            --success-border: #22c55e;
            --error-bg: #991b1b;
            --error-text: #fee2e2;
            --error-border: #ef4444;
            --delete-btn: #b91c1c;
            --delete-btn-hover: #991b1b;
            --footer-text: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        header {
            background-color: var(--bg-header);
            color: var(--text-header);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-info {
            text-align: center;
            flex: 1;
            min-width: 250px;
        }

        .time-display {
            font-size: 1rem;
            margin-top: 0.5rem;
            opacity: 0.9;
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .toggle-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
        }

        .toggle-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin-bottom: 2rem;
        }

        h2 {
            color: var(--accent-text);
            margin-bottom: 1.2rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: bold;
            color: var(--text-secondary);
        }

        input, select, button {
            padding: 0.75rem;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 1rem;
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--accent-dark);
        }

        .btn-delete {
            background-color: var(--delete-btn);
        }

        .btn-delete:hover {
            background-color: var(--delete-btn-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--bg-table-header);
            color: var(--accent-text);
            font-weight: bold;
        }

        tr:hover {
            background-color: var(--hover-row);
        }

        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--footer-text);
            font-size: 0.9rem;
        }

        #noRecords {
            margin-top: 1rem;
            color: var(--footer-text);
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="theme-toggle">
                <button class="toggle-btn" id="themeBtn">🌙 Dark Mode</button>
            </div>
            <div class="header-info">
                <h1>Student Information System</h1>
                <p>Manage Student Records Easily</p>
                <div class="time-display" id="currentTime"></div>
            </div>
        </header>

        <!-- Add Student Form -->
        <div class="card">
            <h2>Add New Student</h2>
            <form id="studentForm">
                <div>
                    <label for="studentId">Student ID:</label>
                    <input type="text" id="studentId" placeholder="e.g. 2024-0001" required>
                </div>
                
                <div>
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" placeholder="Enter full name" required>
                </div>
                
                <div>
                    <label for="course">Course / Program:</label>
                    <input type="text" id="course" placeholder="e.g. BS Computer Science" required>
                </div>
                
                <div>
                    <label for="yearLevel">Year Level:</label>
                    <select id="yearLevel" required>
                        <option value="">-- Select Year --</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="5th Year">5th Year</option>
                    </select>
                </div>
                
                <button type="submit">Add Student</button>
            </form>
            <div id="formMessage" class="message"></div>
        </div>

        <!-- Student List -->
        <div class="card">
            <h2>Student Records</h2>
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Course</th>
                        <th>Year Level</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Students will be added here dynamically -->
                </tbody>
            </table>
            <p id="noRecords">No student records found.</p>
        </div>

        <footer>
            &copy; 2026 Student Information System. All rights reserved.
        </footer>
    </div>

    <script>
        // === TIME DISPLAY ===
        const timeDisplay = document.getElementById('currentTime');
        
        function updateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            timeDisplay.textContent = now.toLocaleDateString('en-US', options);
        }
        
        updateTime();
        setInterval(updateTime, 1000);

        // === DARK MODE TOGGLE ===
        const body = document.body;
        const themeBtn = document.getElementById('themeBtn');
        
        // Load saved preference
        if (localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            themeBtn.textContent = '☀️ Light Mode';
        }
        
        themeBtn.addEventListener('click', function() {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('darkMode', 'enabled');
                themeBtn.textContent = '☀️ Light Mode';
            } else {
                localStorage.setItem('darkMode', 'disabled');
                themeBtn.textContent = '🌙 Dark Mode';
            }
        });

        // === STUDENT SYSTEM ===
        let students = [];

        const studentForm = document.getElementById('studentForm');
        const studentTableBody = document.querySelector('#studentTable tbody');
        const formMessage = document.getElementById('formMessage');
        const noRecords = document.getElementById('noRecords');

        studentForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const studentId = document.getElementById('studentId').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const course = document.getElementById('course').value.trim();
            const yearLevel = document.getElementById('yearLevel').value;

            const duplicate = students.find(s => s.id === studentId);
            if (duplicate) {
                showMessage('Error: Student ID already exists!', 'error');
                return;
            }

            students.push({
                id: studentId,
                name: fullName,
                course: course,
                year: yearLevel
            });
            
            updateStudentTable();
            showMessage('Student added successfully!', 'success');
            studentForm.reset();
        });

        function updateStudentTable() {
            studentTableBody.innerHTML = '';

            if (students.length === 0) {
                noRecords.style.display = 'block';
                return;
            }
            noRecords.style.display = 'none';

            students.forEach((student, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.course}</td>
                    <td>${student.year}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteStudent(${index})">Delete</button>
                    </td>
                `;
                studentTableBody.appendChild(row);
            });
        }

        function deleteStudent(index) {
            if (confirm('Are you sure you want to delete this student record?')) {
                students.splice(index, 1);
                updateStudentTable();
            }
        }

        function showMessage(text, type) {
            formMessage.textContent = text;
            formMessage.className = `message ${type}`;
            formMessage.style.display = 'block';
            
            setTimeout(() => {
                formMessage.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
