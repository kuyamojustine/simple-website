<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333333;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 1.5rem;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
        }

        h2 {
            color: #1e40af;
            margin-bottom: 1.2rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: bold;
            color: #4b5563;
        }

        input, select, button {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .btn-delete {
            background-color: #dc2626;
        }

        .btn-delete:hover {
            background-color: #b91c1c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #eff6ff;
            color: #1e40af;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Information System</h1>
            <p>Manage Student Records Easily</p>
        </header>

        <!-- Add Student Form -->
        <div class="card">
            <h2>Add New Student</h2>
            <form id="studentForm">
                <div>
                    <label for="studentId">Student ID:</label>
                    <input type="text" id="studentId" placeholder="e.g. 2024-0001" required>
                </div>
                
                <div>
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" placeholder="Enter full name" required>
                </div>
                
                <div>
                    <label for="course">Course / Program:</label>
                    <input type="text" id="course" placeholder="e.g. BS Computer Science" required>
                </div>
                
                <div>
                    <label for="yearLevel">Year Level:</label>
                    <select id="yearLevel" required>
                        <option value="">-- Select Year --</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="5th Year">5th Year</option>
                    </select>
                </div>
                
                <button type="submit">Add Student</button>
            </form>
            <div id="formMessage" class="message"></div>
        </div>

        <!-- Student List -->
        <div class="card">
            <h2>Student Records</h2>
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Course</th>
                        <th>Year Level</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Students will be added here dynamically -->
                </tbody>
            </table>
            <p id="noRecords" style="margin-top: 1rem; color: #6b7280; display: none;">No student records found.</p>
        </div>

        <footer>
            &copy; 2026 Student Information System. All rights reserved.
        </footer>
    </div>

    <script>
        // Student data storage
        let students = [];

        // DOM Elements
        const studentForm = document.getElementById('studentForm');
        const studentTableBody = document.querySelector('#studentTable tbody');
        const formMessage = document.getElementById('formMessage');
        const noRecords = document.getElementById('noRecords');

        // Form submission handler
        studentForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const studentId = document.getElementById('studentId').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const course = document.getElementById('course').value.trim();
            const yearLevel = document.getElementById('yearLevel').value;

            // Check for duplicate ID
            const duplicate = students.find(s => s.id === studentId);
            if (duplicate) {
                showMessage('Error: Student ID already exists!', 'error');
                return;
            }

            // Add student
            const newStudent = {
                id: studentId,
                name: fullName,
                course: course,
                year: yearLevel
            };
            
            students.push(newStudent);
            updateStudentTable();
            showMessage('Student added successfully!', 'success');
            studentForm.reset();
        });

        // Update table display
        function updateStudentTable() {
            // Clear existing rows
            studentTableBody.innerHTML = '';

            // Show/hide no records message
            if (students.length === 0) {
                noRecords.style.display = 'block';
                return;
            }
            noRecords.style.display = 'none';

            // Add each student row
            students.forEach((student, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.course}</td>
                    <td>${student.year}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteStudent(${index})">Delete</button>
                    </td>
                `;
                studentTableBody.appendChild(row);
            });
        }

        // Delete student
        function deleteStudent(index) {
            if (confirm('Are you sure you want to delete this student record?')) {
                students.splice(index, 1);
                updateStudentTable();
            }
        }

        // Show feedback message
        function showMessage(text, type) {
            formMessage.textContent = text;
            formMessage.className = `message ${type}`;
            formMessage.style.display = 'block';
            
            setTimeout(() => {
                formMessage.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
